{% extends "layout.html" %}
{% block title %}New habit · HabitFlow{% endblock %}
{% block content %}
  <div class="page-head">
    <div>
      <h1>New habit</h1>
      <p class="muted">Small, consistent actions create lasting change.</p>
    </div>
  </div>

  <div class="card form-card">
    <form method="post" class="form">
      <label for="name">Habit name</label>
      <input type="text" id="name" name="name" maxlength="100"
             placeholder="e.g. Read 10 pages" required autofocus>

      <div class="form-actions">
        <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save habit</button>
      </div>
    </form>
  </div>
{% endblock %}
