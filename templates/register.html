{% extends "layout.html" %}
{% block title %}Create account · HabitFlow{% endblock %}
{% block auth %}
  <h2>Create your account</h2>
  <p class="auth-sub">Start tracking your daily habits in less than a minute.</p>

  <form method="post" class="form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="At least 3 characters"
           autocomplete="username" minlength="3" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 6 characters"
           autocomplete="new-password" minlength="6" required>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
